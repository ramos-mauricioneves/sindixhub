        "200":
          description: Insurance saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeguroPredial"

  /condominios/{condominioId}/health:
    get:
      operationId: getCondominioHealth
      tags: [condominios]
      summary: Get health/alert summary for a condominium
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Health summary with expiry counts
          content:
