openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: API specification for Assistente de Vistoria Condominial
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: report
    description: Condominium inspection report operations
  - name: users
    description: User management
  - name: inspections
    description: Inspection history
  - name: condominios
    description: Condominium management
  - name: areas
    description: Inspection area management
  - name: assets
    description: Asset (CMDB) management
  - name: dashboard
    description: Dashboard summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /generate-report:
    post:
      operationId: generateReport
      tags: [report]
      summary: Generate inspection report
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                notes:
                  type: string
              required:
                - audio
      responses:
        "200":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionReport"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections:
    get:
      operationId: listInspections
      tags: [inspections]
      summary: List inspections
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: urgencia
          in: query
          schema:
            type: string
            enum: [baixa, média, alta]
        - name: status
          in: query
          schema:
            type: string
            enum: [rascunho, gerado, pronto_para_envio, enviado]
        - name: condominioId
          in: query
          schema:
            type: integer
        - name: areaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of inspections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveInspection
      tags: [inspections]
      summary: Save an inspection report to history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInspectionBody"
      responses:
        "201":
          description: Inspection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [inspections]
      summary: Get a single inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inspection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections/{id}/status:
    patch:
      operationId: updateInspectionStatus
      tags: [inspections]
      summary: Update inspection status (sindico only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{clerkId}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update user role (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{clerkId}/condominios:
    get:
      operationId: getUserCondominios
      tags: [users]
      summary: Get condominios associated with a user
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User condominios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"
    post:
      operationId: addUserCondominio
      tags: [users]
      summary: Associate a user with a condominio (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCondominioBody"
      responses:
        "200":
          description: Association created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /users/{clerkId}/condominios/{condominioId}:
    delete:
      operationId: removeUserCondominio
      tags: [users]
      summary: Remove user from a condominio (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Association removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /condominios:
    get:
      operationId: listCondominios
      tags: [condominios]
      summary: List condominios accessible to the current user
      responses:
        "200":
          description: List of condominios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"
    post:
      operationId: createCondominio
      tags: [condominios]
      summary: Create a condominio (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CondominioBody"
      responses:
        "201":
          description: Condominio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"

  /condominios/{id}:
    get:
      operationId: getCondominio
      tags: [condominios]
      summary: Get a single condominio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Condominio details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"
    patch:
      operationId: updateCondominio
      tags: [condominios]
      summary: Update a condominio (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CondominioBody"
      responses:
        "200":
          description: Condominio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"

  /condominios/{condominioId}/areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List areas for a condominio
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBody"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /condominios/{condominioId}/areas/{areaId}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update an area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Delete an area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /condominios/{condominioId}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets for a condominio
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            type: string
            enum: [equipamento, estrutura, sistema]
        - name: criticidade
          in: query
          schema:
            type: string
            enum: [baixa, media, alta]
        - name: status
          in: query
          schema:
            type: string
            enum: [operacional, em_manutencao, inativo]
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBody"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get a single asset
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBody"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary for current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/moradores:
    get:
      operationId: listMoradores
      summary: List residents for a condominium
      tags: [Moradores]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: query
          name: tipo
          schema:
            type: string
        - in: query
          name: ativo
          schema:
            type: boolean
      responses:
        "200":
          description: List of residents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Morador"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMorador
      summary: Create a resident
      tags: [Moradores]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoradorBody"
      responses:
        "201":
          description: Resident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Morador"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/moradores/{moradorId}:
    patch:
      operationId: updateMorador
      summary: Update a resident
      tags: [Moradores]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: path
          name: moradorId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoradorBody"
      responses:
        "200":
          description: Resident updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Morador"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMorador
      summary: Delete a resident
      tags: [Moradores]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: path
          name: moradorId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/lancamentos:
    get:
      operationId: listLancamentos
      summary: List financial entries for a condominium
      tags: [Financeiro]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: query
          name: tipo
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: mes
          schema:
            type: string
      responses:
        "200":
          description: List of financial entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lancamento"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createLancamento
      summary: Create a financial entry
      tags: [Financeiro]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoBody"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/lancamentos/{lancamentoId}:
    patch:
      operationId: updateLancamento
      summary: Update a financial entry
      tags: [Financeiro]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: path
          name: lancamentoId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoBody"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLancamento
      summary: Delete a financial entry
      tags: [Financeiro]
      parameters:
        - in: path
          name: condominioId
          required: true
          schema:
            type: integer
        - in: path
          name: lancamentoId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InspectionReport:
      type: object
      properties:
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
      required:
        - tipo
        - urgencia
        - acao
        - resumo
        - comunicado

    SaveInspectionBody:
      type: object
      properties:
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
        local:
          type: string
        condominio:
          type: string
        condominioId:
          type: integer
        areaId:
          type: integer
        assetId:
          type: integer
        tipoEvento:
          type: string
          enum: [vistoria, manutencao, incidente, melhoria]
      required:
        - tipo
        - urgencia
        - acao
        - resumo
        - comunicado

    UpdateInspectionStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pronto_para_envio, enviado]
      required:
        - status

    SavedInspection:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
        local:
          type: string
        condominio:
          type: string
        status:
          type: string
          enum: [rascunho, gerado, pronto_para_envio, enviado]
        condominioId:
          type: integer
        areaId:
          type: integer
        assetId:
          type: integer
        tipoEvento:
          type: string
          enum: [vistoria, manutencao, incidente, melhoria]
        createdByClerkId:
          type: string
