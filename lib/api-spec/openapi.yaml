              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    InspectionReport:
      type: object
      properties:
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
      required:
        - tipo
        - urgencia
        - acao
        - resumo
        - comunicado

    SaveInspectionBody:
      type: object
      properties:
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
        local:
          type: string
        condominio:
          type: string
        condominioId:
          type: integer
        areaId:
          type: integer
        assetId:
          type: integer
        tipoEvento:
          type: string
          enum: [vistoria, manutencao, incidente, melhoria]
        tipoVistoria:
          type: string
          enum: [tecnica, predial, checklist, acompanhamento_diario, acompanhamento_semanal, entrega_chaves, emergencial]
        escopo:
          type: string
          enum: [completa, areas_especificas]
        areasIds:
          type: string
        selectedAssetIds:
          type: string
      required:
        - tipo
        - urgencia
        - acao
        - resumo
        - comunicado

    UpdateInspectionStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pronto_para_envio, enviado]
      required:
        - status

    SavedInspection:
      type: object
      properties:
        id:
          type: integer
        tipo:
          type: string
        urgencia:
          type: string
          enum: [baixa, média, alta]
        acao:
          type: string
        resumo:
          type: string
        comunicado:
          type: string
        transcricao:
          type: string
        analise_imagens:
          type: string
        local:
          type: string
        condominio:
          type: string
        status:
          type: string
          enum: [rascunho, gerado, pronto_para_envio, enviado]
        condominioId:
          type: integer
        areaId:
          type: integer
        assetId:
          type: integer
        tipoEvento:
          type: string
          enum: [vistoria, manutencao, incidente, melhoria]
        tipoVistoria:
          type: string
          nullable: true
          enum: [tecnica, predial, checklist, acompanhamento_diario, acompanhamento_semanal, entrega_chaves, emergencial]
        escopo:
          type: string
          enum: [completa, areas_especificas]
        areasIds:
          type: string
          nullable: true
        selectedAssetIds:
          type: string
          nullable: true
        createdByClerkId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - tipo
        - urgencia
        - acao
        - resumo
        - comunicado
        - status
        - tipoEvento
        - escopo
        - createdByClerkId
        - createdAt

    InspectionListResponse:
      type: object
      properties:
        inspections:
          type: array
          items:
            $ref: "#/components/schemas/SavedInspection"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - inspections
        - total
        - page
        - limit

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [global_admin, admin, sindico, vistoriador]
        condominio:
          type: string
        condominioIds:
          type: array
          items:
            type: integer
        empresaId:
          type: integer
          nullable: true
          description: Tenant FK. Null only for global_admin.
        prestadorId:
          type: integer
          nullable: true
          description: Set when this user is staff of a prestador (e.g. a zelador employed by a terceirizada).
        escopoEmpresa:
          type: boolean
          description: When true, this user has unrestricted access to every condomínio in their own empresa (no user_condominios rows needed).
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - email
        - role
        - createdAt

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [global_admin, admin, sindico, vistoriador]
        condominio:
          type: string
      required:
        - role

    UserCondominioBody:
      type: object
      properties:
        condominioId:
          type: integer
      required:
        - condominioId

    Condominio:
      type: object
      properties:
        id:
          type: integer
        empresaId:
          type: integer
          description: Tenant FK — which empresa (síndico profissional company) this condomínio belongs to.
        nome:
          type: string
        cnpj:
          type: string
          nullable: true
        tipoCondominio:
          type: string
          enum: [residencial, comercial, misto]
        endereco:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        bairro:
          type: string
          nullable: true
        cidade:
          type: string
          nullable: true
        estado:
          type: string
          nullable: true
        totalUnidades:
          type: integer
          nullable: true
        totalBlocos:
          type: integer
          nullable: true
        totalAndares:
          type: integer
          nullable: true
        anoConstrucao:
          type: integer
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        sindico:
          type: string
          nullable: true
        zelador:
          type: string
          nullable: true
        administradora:
          type: string
          nullable: true
        inscricaoMunicipal:
          type: string
          nullable: true
        areaTotalM2:
          type: number
          nullable: true
        areaLazerM2:
          type: number
          nullable: true
        numElevadores:
          type: integer
          nullable: true
        tipoPortaria:
          type: string
          nullable: true
        equipe:
          $ref: "#/components/schemas/EquipeData"
          nullable: true
        ativo:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nome
        - tipoCondominio
        - ativo
        - createdAt

    CondominioBody:
      type: object
      properties:
        nome:
          type: string
        cnpj:
          type: string
        tipoCondominio:
          type: string
          enum: [residencial, comercial, misto]
        endereco:
          type: string
        cep:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        estado:
          type: string
        totalUnidades:
          type: integer
        totalBlocos:
          type: integer
        totalAndares:
          type: integer
        anoConstrucao:
          type: integer
        telefone:
          type: string
        email:
          type: string
        sindico:
          type: string
        zelador:
          type: string
        administradora:
          type: string
        inscricaoMunicipal:
          type: string
        areaTotalM2:
          type: number
        areaLazerM2:
          type: number
        numElevadores:
          type: integer
        tipoPortaria:
          type: string
        equipe:
          $ref: "#/components/schemas/EquipeData"
        ativo:
          type: boolean
      required:
        - nome

    Area:
      type: object
      properties:
        id:
          type: integer
        condominioId:
          type: integer
        nome:
          type: string
        tipo:
          type: string
        bloco:
          type: string
          nullable: true
        andar:
          type: integer
          nullable: true
        privacidade:
          type: string
          enum: [publica, privada, mista]
        descricao:
          type: string
          nullable: true
        capacidade:
          type: integer
          nullable: true
        reservavel:
          type: boolean
        horarioAbertura:
          type: string
          nullable: true
        horarioFechamento:
          type: string
          nullable: true
        ativo:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - condominioId
        - nome
        - tipo
        - privacidade
        - reservavel
        - ativo
        - createdAt

    AreaBody:
      type: object
      properties:
        nome:
          type: string
        tipo:
          type: string
        bloco:
          type: string
        andar:
          type: integer
        privacidade:
          type: string
          enum: [publica, privada, mista]
        descricao:
          type: string
        capacidade:
          type: integer
        reservavel:
          type: boolean
        horarioAbertura:
          type: string
        horarioFechamento:
          type: string
      required:
        - nome
        - tipo

    Asset:
      type: object
      properties:
        id:
          type: integer
        condominioId:
          type: integer
        areaId:
          type: integer
        nome:
          type: string
        tipo:
          type: string
          enum: [equipamento, estrutura, sistema]
        criticidade:
          type: string
          enum: [baixa, media, alta]
        status:
          type: string
          enum: [operacional, em_manutencao, inativo]
        descricao:
          type: string
        categoriaServico:
          type: string
          nullable: true
          enum: [elevador, hidraulica, eletrica, pintura, jardinagem, portaria_seguranca, limpeza, ar_condicionado, estrutural_civil, incendio_ppci, dedetizacao, outro]
          description: Trade/service category used to match this asset against prestadores.categoria for the acionamento-suggestion feature.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - condominioId
        - nome
        - tipo
        - criticidade
        - status
        - createdAt
        - updatedAt

    PublicAsset:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo:
          type: string
        criticidade:
          type: string
        status:
          type: string
        descricao:
          type: string
        condominioNome:
          type: string
        areaNome:
          type: string
        ultimasVistorias:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              tipo:
                type: string
              urgencia:
                type: string
              resumo:
                type: string
              createdAt:
                type: string
                format: date-time
            required: [id, tipo, urgencia, resumo, createdAt]
      required:
        - id
        - nome
        - tipo
        - criticidade
        - status
        - condominioNome
        - ultimasVistorias

    AssetBody:
      type: object
      properties:
        areaId:
          type: integer
        nome:
          type: string
        tipo:
          type: string
          enum: [equipamento, estrutura, sistema]
        criticidade:
          type: string
          enum: [baixa, media, alta]
        status:
          type: string
          enum: [operacional, em_manutencao, inativo]
        descricao:
          type: string
        categoriaServico:
          type: string
          nullable: true
          enum: [elevador, hidraulica, eletrica, pintura, jardinagem, portaria_seguranca, limpeza, ar_condicionado, estrutural_civil, incendio_ppci, dedetizacao, outro]
      required:
        - nome
        - tipo
        - criticidade
        - status

    DashboardSummary:
      type: object
      properties:
        totalCondominios:
          type: integer
        totalAssets:
          type: integer
        assetsOperacional:
          type: integer
        assetsEmManutencao:
          type: integer
        assetsInativo:
          type: integer
        assetsCriticos:
          type: integer
        totalEventos30d:
          type: integer
        eventosAlta:
          type: integer
        eventosMedios:
          type: integer
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/SavedInspection"
        criticalAssets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
      required:
        - totalCondominios
        - totalAssets
        - assetsOperacional
        - assetsEmManutencao
        - assetsInativo
        - assetsCriticos
        - totalEventos30d
        - eventosAlta
        - eventosMedios
        - recentEvents
        - criticalAssets

    AssembleiaTopic:
      type: object
      properties:
        titulo:
          type: string
        categoria:
          type: string
        prioridade:
          type: string
        descricao:
          type: string
        evidencias:
          type: integer
        condominios:
          type: array
          items:
            type: string
        tiposEvento:
          type: array
          items:
            type: string
        urgenciaMedia:
          type: string
      required:
        - titulo
        - categoria
        - prioridade
        - descricao
        - evidencias
        - condominios
        - tiposEvento
        - urgenciaMedia

    AssembleiasInsights:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/AssembleiaTopic"
        totalInspections:
          type: integer
        periodMonths:
          type: integer
        generatedAt:
          type: string
          format: date-time
      required:
        - topics
        - totalInspections
        - periodMonths
        - generatedAt

    EquipeData:
      type: object
      properties:
        subSindico:
          type: object
          nullable: true
          properties:
            nome:
              type: string
            telefone:
              type: string
            email:
              type: string
        zelador:
          type: object
          nullable: true
          properties:
            tipo:
              type: string
            nome:
              type: string
            telefone:
              type: string
            empresaTerceirizadora:
              type: string
        portaria:
          type: object
          nullable: true
          properties:
            tipo:
              type: string
            empresa:
              type: string
        asg:
          type: object
          nullable: true
          properties:
            quantidade:
              type: integer
            empresa:
              type: string
        seguranca:
          type: object
          nullable: true
          properties:
            quantidade:
              type: integer
            empresa:
              type: string

