    # The per-condomínio ASSOCIATION between a prestador master record
    # (see PrestadorMestre) and this condomínio — not the master record
    # itself. `id` here is the association's id (prestador_condominios.id),
    # `prestadorId` points at the master. categoria/telefone/email are
    # overrides that fall back to the master's value when null (already
    # resolved server-side — this response always has the effective value).
    PrestadorCondominio:
      type: object
      properties:
        id:
          type: integer
          description: Association id (not the prestador master record's id — see prestadorId).
        prestadorId:
          type: integer
        condominioId:
          type: integer
        nome:
          type: string
          description: From the master record — read-only here, edit via the empresa-level prestador endpoints.
        categoria:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        vigenciaInicio:
          type: string
          nullable: true
        vigenciaFim:
          type: string
          nullable: true
        valorMensal:
          type: number
          nullable: true
        avaliacao:
          type: integer
          nullable: true
        observacoes:
          type: string
          nullable: true
        ativo:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - prestadorId
        - condominioId
        - nome
        - ativo
        - createdAt

    # POST body: either `prestadorId` (associate an existing empresa-level
    # prestador to this condomínio) OR `nome` (+ optional categoria/telefone/
    # email/observacoes, creating a brand-new master record and associating
    # it in one step). Either way, the override/contract fields below apply
    # to the new association.
    CreatePrestadorAssociacaoBody:
      type: object
      properties:
        prestadorId:
          type: integer
        nome:
          type: string
        categoria:
          type: string
        telefone:
          type: string
        email:
          type: string
        vigenciaInicio:
          type: string
        vigenciaFim:
          type: string
        valorMensal:
          type: number
        avaliacao:
          type: integer
        observacoes:
          type: string

    # PATCH body: only edits the per-condomínio association/override — never
    # the master record's own fields (nome, cnpj).
    UpdatePrestadorAssociacaoBody:
      type: object
      properties:
        categoria:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
