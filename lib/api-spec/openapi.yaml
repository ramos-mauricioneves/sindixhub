      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Insurance record or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeguroPredial"
        "404":
          description: No insurance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertSeguroPredial
      tags: [seguro]
      summary: Create or update building insurance
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeguroPredialBody"
