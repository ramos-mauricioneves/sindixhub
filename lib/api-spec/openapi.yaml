openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: API specification for Assistente de Vistoria Condominial
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: report
    description: Condominium inspection report operations
  - name: users
    description: User management
  - name: inspections
    description: Inspection history
  - name: condominios
    description: Condominium management
  - name: areas
    description: Inspection area management
  - name: assets
    description: Asset (CMDB) management
  - name: dashboard
    description: Dashboard summary
  - name: contratos
    description: Contract management per condominium
  - name: prestadores
    description: Service provider management
  - name: documentos
    description: Document and inspection report management
  - name: seguro
    description: Building insurance management
  - name: empresas
    description: Multi-tenant empresa (síndico profissional company) management — global_admin only
  - name: acionamentos
    description: Prestador suggestion and dispatch tracking for inspection findings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /generate-report:
    post:
      operationId: generateReport
      tags: [report]
      summary: Generate inspection report
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                notes:
                  type: string
              required:
                - audio
      responses:
        "200":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionReport"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI processing error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections:
    get:
      operationId: listInspections
      tags: [inspections]
      summary: List inspections
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: urgencia
          in: query
          schema:
            type: string
            enum: [baixa, média, alta]
        - name: status
          in: query
          schema:
            type: string
            enum: [rascunho, gerado, pronto_para_envio, enviado]
        - name: condominioId
          in: query
          schema:
            type: integer
        - name: areaId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of inspections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveInspection
      tags: [inspections]
      summary: Save an inspection report to history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInspectionBody"
      responses:
        "201":
          description: Inspection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections/{id}:
    get:
      operationId: getInspection
      tags: [inspections]
      summary: Get a single inspection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inspection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inspections/{id}/status:
    patch:
      operationId: updateInspectionStatus
      tags: [inspections]
      summary: Update inspection status (sindico only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedInspection"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{clerkId}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update user role (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{clerkId}/condominios:
    get:
      operationId: getUserCondominios
      tags: [users]
      summary: Get condominios associated with a user
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User condominios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"
    post:
      operationId: addUserCondominio
      tags: [users]
      summary: Associate a user with a condominio (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCondominioBody"
      responses:
        "200":
          description: Association created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /users/{clerkId}/condominios/{condominioId}:
    delete:
      operationId: removeUserCondominio
      tags: [users]
      summary: Remove user from a condominio (admin only)
      parameters:
        - name: clerkId
          in: path
          required: true
          schema:
            type: string
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Association removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /condominios:
    get:
      operationId: listCondominios
      tags: [condominios]
      summary: List condominios accessible to the current user
      responses:
        "200":
          description: List of condominios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"
    post:
      operationId: createCondominio
      tags: [condominios]
      summary: Create a condominio (admin or sindico)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CondominioBody"
      responses:
        "201":
          description: Condominio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"

  /condominios/{id}:
    get:
      operationId: getCondominio
      tags: [condominios]
      summary: Get a single condominio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Condominio details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"
    patch:
      operationId: updateCondominio
      tags: [condominios]
      summary: Update a condominio (admin or associated sindico)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CondominioBody"
      responses:
        "200":
          description: Condominio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"

  /condominios/{condominioId}/areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List areas for a condominio
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBody"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /condominios/{condominioId}/areas/{areaId}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update an area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Delete an area (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /public/assets/{assetId}:
    get:
      operationId: getPublicAsset
      tags: [assets]
      summary: Get public asset info (for QR code scans, no auth)
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAsset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List assets for a condominio
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: areaId
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            type: string
            enum: [equipamento, estrutura, sistema]
        - name: criticidade
          in: query
          schema:
            type: string
            enum: [baixa, media, alta]
        - name: status
          in: query
          schema:
            type: string
            enum: [operacional, em_manutencao, inativo]
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBody"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /condominios/{condominioId}/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get a single asset
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetBody"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset (admin or sindico)
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /condominios/{condominioId}/contratos:
    get:
      operationId: listContratos
      tags: [contratos]
      summary: List contracts for a condominium
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContratoCondominio"
    post:
      operationId: createContrato
      tags: [contratos]
      summary: Create a contract
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoCondominioBody"
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoCondominio"

  /condominios/{condominioId}/contratos/{contratoId}:
    patch:
      operationId: updateContrato
      tags: [contratos]
      summary: Update a contract
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: contratoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratoCondominioBody"
      responses:
        "200":
          description: Contract updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoCondominio"
    delete:
      operationId: deleteContrato
      tags: [contratos]
      summary: Delete a contract
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: contratoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /condominios/{condominioId}/prestadores:
    get:
      operationId: listPrestadores
      tags: [prestadores]
      summary: List service providers for a condominium
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of service providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrestadorCondominio"
    post:
      operationId: createPrestador
      tags: [prestadores]
      summary: Create a service provider
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestadorAssociacaoBody"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestadorCondominio"

  /condominios/{condominioId}/prestadores/{prestadorId}:
    patch:
      operationId: updatePrestador
      tags: [prestadores]
      summary: Update a service provider
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: prestadorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrestadorAssociacaoBody"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestadorCondominio"
    delete:
      operationId: deletePrestador
      tags: [prestadores]
      summary: Delete a service provider
      parameters:
        - name: condominioId
          in: path
          required: true
          schema:
            type: integer
        - name: prestadorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /empresas:
    get:
      operationId: listEmpresas
      tags: [empresas]
      summary: List empresas (global_admin only)
      responses:
        "200":
          description: List of empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Empresa"
    post:
      operationId: createEmpresa
      tags: [empresas]
      summary: Create an empresa (global_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaBody"
      responses:
        "201":
          description: Empresa created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"

  /empresas/{id}:
    patch:
      operationId: updateEmpresa
      tags: [empresas]
      summary: Update an empresa (global_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaBody"
      responses:
        "200":
          description: Empresa updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empresa"

  /empresas/{id}/condominios:
    get:
      operationId: listEmpresaCondominios
      tags: [empresas]
      summary: List condomínios belonging to this empresa (global_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of condomínios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"

  /empresas/{empresaId}/prestadores:
    get:
      operationId: listEmpresaPrestadores
      tags: [prestadores]
      summary: List master prestador records for this empresa
      parameters:
        - name: empresaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of prestador master records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrestadorMestre"
    post:
      operationId: createEmpresaPrestador
      tags: [prestadores]
      summary: Create a prestador master record at the empresa level
      parameters:
        - name: empresaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestadorMestreBody"
      responses:
        "201":
          description: Prestador created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestadorMestre"

  /prestadores/sugestao:
    get:
      operationId: sugerirPrestador
      tags: [acionamentos]
      summary: Suggest a prestador for a finding, matched by service category (stateless — computes on the fly, writes nothing)
      parameters:
        - name: condominioId
          in: query
          required: true
          schema:
            type: integer
        - name: assetId
          in: query
          required: false
          schema:
            type: integer
        - name: areaId
          in: query
          required: false
          schema:
            type: integer
        - name: categoria
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Suggested prestadores, best match first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SugestaoPrestadorResponse"

  /prestadores/{id}:
    patch:
      operationId: updatePrestadorMestre
      tags: [prestadores]
      summary: Update a prestador master record
      parameters:
        - name: id
          in: path
