name = "sindixhub-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# NOTE on compatibility_flags: nodejs_compat IS required. postgres-js's
# `cf/` build uses the Workers `cloudflare:sockets` TCP API for the actual
# connection, but it still imports `node:events`, `node:buffer`, and
# `node:stream` for its internals (EventEmitter, Buffer, streaming parser).
# Verified locally: `wrangler dev` fails to boot with
# "Uncaught Error: No such module 'node:events'" when this flag is unset.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ─── Non-secret configuration ──────────────────────────────────────────────
# AUTH_BYPASS is a plain (non-secret) var: it's a dev-only escape hatch that
# disables Supabase Auth entirely and impersonates a fixed local admin user.
# It MUST default to unset/false in every deployed (production or preview)
# environment — never set AUTH_BYPASS=true via `[vars]` for a real
# deployment. Only set it in a local `.dev.vars` file for `wrangler dev`
# (see LOCAL_DEV.md).
#
# SUPABASE_URL / SUPABASE_ANON_KEY are also plain (non-secret) vars — same
# public-safe project URL + anon/publishable key used client-side. The
# backend uses them to build a createClient() instance for verifying bearer
# tokens via auth.getUser(jwt) in src/app.ts.
[vars]
AUTH_BYPASS = "false"
SUPABASE_URL = "https://pcqufvqoswlwdfzxmuis.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_fDwriq7QZfYttdCPJXvASg_YIcgGci1"

# ─── Secrets (set via `wrangler secret put <NAME>`, never in this file) ───
# DATABASE_URL       — Supabase pooler connection string, port 6543,
#                       pgbouncer transaction mode, e.g.:
#                       postgres://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
# GOOGLE_GENERATIVE_AI_API_KEY — Gemini. Single multimodal call takes the
#                       raw audio + images + notes and returns transcription,
#                       image analysis, and the structured report together —
#                       see src/services/gemini-service.ts. No OpenAI/Whisper
#                       key needed anymore (Gemini transcribes audio
#                       natively). Same env var name convention as this org's
#                       other Workers app (meucafe/brew-buddy-ia).
#
# Run once per environment:
#   wrangler secret put DATABASE_URL
#   wrangler secret put GOOGLE_GENERATIVE_AI_API_KEY

# ─── CORS ───────────────────────────────────────────────────────────────────
# ALLOWED_ORIGINS is a plain (non-secret) var: comma-separated list of
# origins allowed to make credentialed requests (see src/app.ts). Set this
# once the Pages custom domain is known, e.g.:
# [vars]
# ALLOWED_ORIGINS = "https://app.yourdomain.com,https://sindixhub.pages.dev"

# ─── Routes / custom domain ────────────────────────────────────────────────
# Uncomment and set once a custom domain is attached to this Worker in the
# Cloudflare dashboard (Workers & Pages > sindixhub-api > Triggers):
# routes = [
#   { pattern = "api.yourdomain.com/*", custom_domain = true }
# ]
