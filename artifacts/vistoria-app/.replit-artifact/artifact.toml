kind = "web"
previewPath = "/"
title = "Assistente de Vistoria Condominial"
version = "1.0.0"
id = "artifacts/vistoria-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24561

[services.development]
run = "pnpm --filter @workspace/vistoria-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vistoria-app", "run", "build" ]
publicDir = "artifacts/vistoria-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24561"
BASE_PATH = "/"
